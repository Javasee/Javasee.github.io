{{- /* Waline 评论区（匿名 + 登录），服务端：Vercel + GitHub 存储 */ -}}
<link rel="stylesheet" href="{{ "waline/waline.css" | relURL }}">
<div id="waline-comment" class="waline-comment"></div>
<script type="module">
  import { init } from '{{ "waline/waline.js" | relURL }}';
  init({
    el: '#waline-comment',
    serverURL: 'https://api.javasee.com',
    path: location.pathname,
    lang: 'zh-CN',
    dark: 'html[data-theme="dark"]',
    meta: ['nick', 'mail'],
    requiredMeta: ['nick'],
    login: 'enable',
    noRss: true,
    locale: { nickError: '请填写昵称' },
    imageUploader: async () => '',
  });

  /* ===== 输入框：随文本自动增高（高度 = 文本 + 一行） ===== */
  const lineHeight = (el) => parseFloat(getComputedStyle(el).lineHeight) || 24;
  const grow = (el) => {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + lineHeight(el)) + 'px';
  };
  const wire = (el) => {
    if (el.dataset.grown) return;
    el.dataset.grown = '1';
    el.addEventListener('input', () => grow(el));
    document.addEventListener('click', () => setTimeout(() => grow(el), 0), true);
  };

  /* ===== 原生 emoji 表情选择器（MD3 风格，替代图片表情包） ===== */
  const EMOJIS = (
    '😀 😁 😂 🤣 😊 😍 😘 😋 🤔 🤨 😐 😅 😢 😭 😡 😤 ' +
    '😱 🥳 😎 🤗 😏 😌 🙃 😉 😜 🤪 🧐 🥺 😩 🤯 😴 🤢 ' +
    '👍 👎 👏 🙏 💪 🤝 👋 ✌️ 🤞 👌 ❤️ 🧡 💛 💚 💙 💜 ' +
    '🔥 ✨ ⭐ 🎉 🎊 🎈 💡 ✅ ❌ ⚠️ 📌 📝 📷 🎧 💻 🚀'
  ).split(' ').filter(Boolean);

  const pickers = new WeakSet();
  const buildPicker = () => {
    const actions = document.querySelector('[data-waline] .wl-actions');
    const ta = document.querySelector('.wl-editor');
    if (!actions || !ta || pickers.has(actions)) return;
    pickers.add(actions);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'wl-action wl-emoji-native';
    btn.title = '插入表情';
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="8.8" cy="10" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.2" cy="10" r="1.15" fill="currentColor" stroke="none"/><path d="M10.2 14.6q1.8 1.3 3.6 0"/></svg>';

    const pop = document.createElement('div');
    pop.className = 'wl-emoji-native-pop';
    EMOJIS.forEach((ch) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = ch;
      b.addEventListener('mousedown', (e) => e.preventDefault());
      b.addEventListener('click', () => {
        const s = ta.selectionStart, t = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + ch + ta.value.slice(t);
        ta.selectionStart = ta.selectionEnd = s + ch.length;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        ta.focus();
      });
      pop.appendChild(b);
    });

    btn.addEventListener('click', () => pop.classList.toggle('display'));
    document.addEventListener('click', (e) => {
      if (!pop.contains(e.target) && !btn.contains(e.target)) pop.classList.remove('display');
    });

    actions.prepend(btn);
    actions.appendChild(pop);
    wire(ta);
  };

  /* ===== 加载看门狗：网络不通时给出提示与重试 ===== */
  setTimeout(() => {
    const root = document.querySelector('.waline-comment');
    if (!root || root.querySelector('.wl-panel') || root.querySelector('.waline-timeout')) return;
    const tip = document.createElement('div');
    tip.className = 'waline-timeout';
    const span = document.createElement('span');
    span.textContent = '评论加载超时（当前网络不稳定）';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = '重试';
    retry.addEventListener('click', () => location.reload());
    tip.appendChild(span);
    tip.appendChild(retry);
    root.appendChild(tip);
  }, 8000);

  let tries = 0;
  const boot = () => {
    buildPicker();
    if (!document.querySelector('.wl-emoji-native') && tries++ < 100) setTimeout(boot, 200);
  };
  boot();
</script>
