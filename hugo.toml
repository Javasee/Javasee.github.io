baseURL = "https://javasee.github.io/"
title = "Javasee's Blog"
theme = "PaperMod"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 15

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  dateFormat = "2006-01-02"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Javasee"

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "essays"
    name = "随笔"
    url = "/essays/"
    weight = 10
  [[menu.main]]
    identifier = "retro"
    name = "工程复盘"
    url = "/retro/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
